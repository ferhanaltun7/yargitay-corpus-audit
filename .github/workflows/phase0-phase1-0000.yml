name: Phase 0-1 Audit - Yargitay shard 0000

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase0-phase1-0000.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover and download shard via Dataset Server
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          dataset = "hamzabagirsakci/turkish-court-decisions"
          api = "https://datasets-server.huggingface.co/parquet?" + urlencode({"dataset": dataset})
          req = Request(api, headers={"User-Agent": "yargitay-corpus-audit/1.0"})
          with urlopen(req, timeout=60) as r:
              payload = json.load(r)

          files = [
              x for x in payload["parquet_files"]
              if x.get("config") == "yargitay"
              and x.get("split") == "train"
              and x.get("filename", "").endswith("0000.parquet")
          ]
          if len(files) != 1:
              raise SystemExit(f"Expected exactly one yargitay 0000 shard, got {len(files)}")

          entry = files[0]
          print("Dataset Server entry:", json.dumps(entry, ensure_ascii=False))
          url = entry["url"]

          out = Path("data/raw/yargitay/train/0000.parquet")
          out.parent.mkdir(parents=True, exist_ok=True)
          req2 = Request(url, headers={"User-Agent": "yargitay-corpus-audit/1.0"})
          with urlopen(req2, timeout=120) as r, out.open("wb") as w:
              while True:
                  chunk = r.read(8 * 1024 * 1024)
                  if not chunk:
                      break
                  w.write(chunk)

          print("Downloaded", out, out.stat().st_size, "bytes")
          PY
          ls -lh data/raw/yargitay/train/0000.parquet

      - name: Run Phase 0-1 audit and verify pinned hash
        run: |
          rm -rf audit/phase0_phase1_0000
          python scripts/audit_one_shard.py \
            --file data/raw/yargitay/train/0000.parquet \
            --out audit/phase0_phase1_0000

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase0-phase1-0000
          path: audit/phase0_phase1_0000/
          if-no-files-found: error

      - name: Commit audit results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/phase0_phase1_0000
          if git diff --cached --quiet; then
            echo "No audit changes to commit."
          else
            git commit -m "Add Phase 0-1 audit results for shard 0000 [skip ci]"
            git push
          fi
