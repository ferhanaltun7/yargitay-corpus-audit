name: Phase 2B Official Verification From Sample Artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase2b-from-artifact.yml"

permissions:
  contents: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download previously generated 1000-row sample artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/full_corpus
          curl -L --fail             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/ferhanaltun7/yargitay-corpus-audit/actions/artifacts/10583008944/zip"             -o /tmp/full-audit.zip
          unzip -j /tmp/full-audit.zip verification_sample_1000.csv -d audit/full_corpus
          test -s audit/full_corpus/verification_sample_1000.csv
          wc -c audit/full_corpus/verification_sample_1000.csv

      - name: Verify stratified 100 against official Bedesten
        run: python scripts/official_bedesten_stratified_100.py

      - name: Upload Phase 2B results
        uses: actions/upload-artifact@v4
        with:
          name: phase2b-official-verification-v2
          path: audit/phase2_stratified_100/
          if-no-files-found: error

      - name: Commit Phase 2B results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/phase2_stratified_100
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Phase 2B stratified official verification results [skip ci]"
          git pull --rebase origin main
          git push
