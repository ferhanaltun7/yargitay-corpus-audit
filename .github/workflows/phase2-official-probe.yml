name: Phase 2 Official Bedesten Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase2-official-probe.yml"
      - "scripts/official_bedesten_probe.py"
      - "audit/full_corpus/suspicious_examples_1000.csv"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run official Bedesten probe
        run: python scripts/official_bedesten_probe.py

      - name: Upload probe results
        uses: actions/upload-artifact@v4
        with:
          name: phase2-official-bedesten-probe
          path: audit/phase2_official_probe/
          if-no-files-found: error

      - name: Commit probe results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/phase2_official_probe
          if git diff --cached --quiet; then
            echo "No probe changes to commit."
          else
            git commit -m "Add Phase 2 official Bedesten probe results [skip ci]"
            git push
          fi
