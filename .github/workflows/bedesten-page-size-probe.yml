name: Bedesten Page Size Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bedesten-page-size-probe.yml"
      - "scripts/bedesten_page_size_probe.py"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/bedesten_page_size_probe.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/bedesten_page_size_probe
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Bedesten page-size probe results [skip ci]"
          git pull --rebase origin main
          git push
