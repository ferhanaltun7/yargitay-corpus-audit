name: Bedesten Broad-Query Semantics Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bedesten-phrase-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe broad Bedesten phrases
        run: python scripts/bedesten_phrase_probe.py

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: bedesten-broad-query-probe
          path: audit/bedesten_phrase_probe/

      - name: Commit probe results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/bedesten_phrase_probe
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Add Bedesten broad-query probe results [skip ci]"
          git pull --rebase origin main
          git push
