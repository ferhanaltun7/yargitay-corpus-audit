name: Bedesten Modern Year Coverage Proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bedesten-modern-year-proxy.yml"

permissions:
  contents: write

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run 2016-2026 Bedesten year-total proxy
        run: python scripts/bedesten_modern_year_proxy.py
      - uses: actions/upload-artifact@v4
        with:
          name: bedesten-modern-year-proxy
          path: audit/bedesten_modern_year_proxy/
      - name: Commit proxy results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/bedesten_modern_year_proxy
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Bedesten modern-year coverage proxy [skip ci]"
          git pull --rebase origin main
          git push
