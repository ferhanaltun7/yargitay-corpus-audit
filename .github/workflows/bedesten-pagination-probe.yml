name: Bedesten Pagination Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bedesten-pagination-probe.yml"
      - "scripts/bedesten_pagination_probe.py"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/bedesten_pagination_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: bedesten-pagination-probe
          path: audit/bedesten_pagination_probe/
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/bedesten_pagination_probe
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Bedesten pagination probe results [skip ci]"
          git pull --rebase origin main
          git push
