name: 2026 Incremental Delta Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/incremental-2026-probe.yml"
      - "scripts/bedesten_2026_delta_probe.py"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Bedesten delta schema
        run: python scripts/bedesten_2026_delta_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: incremental-2026-probe
          path: audit/incremental_2026_probe/
      - name: Commit probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/incremental_2026_probe
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add 2026 incremental delta probe results [skip ci]"
          git pull --rebase origin main
          git push
